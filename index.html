<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API FETCH CRUD(posts)</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/css/style.css"/>
  </head>
  <body>
    <div class="container">
      <div class="row mt-5">
        <div class="col-md-6 offset-md-3">
          <div class="card shadow">
            <div class="card-header">
              <h3 class="pl-3">Posts</h3>
            </div>
            <div class="card-body">
              <form id="form">
                <div class="form-group">
                  <label for="title">Title:-</label>
                  <input type="text" class="form-control" required id="title"/>
                </div>
                <div class="form-group">
                  <label for="body">Content:-</label>
                  <textarea rows="3" class="form-control" id="body" required></textarea>
                </div>
                <button
                  type="submit"
                  class="btn btn-primary btn-sm btn-block"
                  id="addPostBtn"
                >
                  Add Post
                </button>
                <button
                  type="button"
                  class="btn btn-dark btn-sm btn-block d-none"
                  id="updatePostBtn"
                >
                  Update Post
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-5" id="postContainer">
        <!-- <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h3 class="m-0">Title</h3>
                    </div>
                    <div class="card-body">
                        <p class="m-0">Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button class="btn btn-sm btn-primary">Edit</button>
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </div>
                </div>
            </div> -->
      </div>
    </div>

    <div class="spinner d-none" id="spinner">
      <div class="spinner-border text-info" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
